name: kubernetes
display_name: Kubernetes
documentation:
  base_url: "https://kubernetes.io/docs/"
  version_pattern: "https://kubernetes.io/docs/{version}/"
  sitemap_url: "https://kubernetes.io/sitemap.xml"
  versions:
    strategy: url_enumeration
    known_versions: ["1.31", "1.30", "1.29", "1.28", "1.27"]
    latest: "1.31"
  content_selectors:
    main_content: "#docsContent"
    navigation: ".toc"
  url_filters:
    include: ["/docs/{version}/**"]
    exclude: ["**/blog/**", "**/releases/**", "**/contribute/**", "**/training/**"]
  page_type_hints:
    tutorial_paths: ["/docs/{version}/tutorials/**"]
    reference_paths: ["/docs/{version}/reference/**"]
