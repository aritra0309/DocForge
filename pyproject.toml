[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docforge-rag"
version = "0.1.0"
description = "Automatically discovers, crawls, versions, chunks, and indexes official software documentation into a RAG-ready knowledge base."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "DocForge Contributors", email = "docforge@example.com"}
]
maintainers = [
    {name = "DocForge Maintainers", email = "maintainers@docforge.example.com"}
]
keywords = ["documentation", "rag", "vector-search", "knowledge-base", "llm", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "markdown-it-py>=3.0,<4",
    "markdownify>=0.12,<1",
    "rich>=13.7,<14",
    "typer>=0.12,<1",
    "tiktoken>=0.7,<1",
    "sentence-transformers>=3.0,<4",
    "chromadb>=0.5,<1",
    "faiss-cpu>=1.8,<2",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "lxml>=5.2,<6",
    "cssselect>=1.2,<2",
    "tiktoken>=0.7,<1",
    "trafilatura>=1.6,<2",
    "readability-lxml>=0.8,<1",
    "tenacity>=8.2,<9",
    "structlog>=24.1,<25",
    "orjson>=3.10,<4",
    "xxhash>=3.4,<4",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<4",
    "types-requests>=2.31,<3",
    "types-PyYAML>=6.0,<7",
    "types-jsonschema>=4.20,<5",
]
docs = [
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.25,<1",
    "mkdocs-autorefs>=1.1,<2",
]
js = [
    "playwright>=1.40,<2",
]
ml = [
    "torch>=2.3,<3",
    "transformers>=4.40,<5",
    "accelerate>=0.30,<1",
]
openai = [
    "openai>=1.30,<2",
]
qdrant = [
    "qdrant-client>=1.10,<2",
]
jina = [
    "jina>=3.28,<4",
]
lancedb = [
    "lancedb>=0.12,<1",
]
weaviate = [
    "weaviate-client>=4.6,<5",
]

[project.scripts]
docforge = "docforge.__main__:main"

[project.urls]
Homepage = "https://github.com/docforge/docforge"
Repository = "https://github.com/docforge/docforge"
Issues = "https://github.com/docforge/docforge/issues"
Documentation = "https://docforge.example.com"
Changelog = "https://github.com/docforge/docforge/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/docforge"]

[tool.hatch.version]
source = "file"
file = "src/docforge/_version.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = [".git", "__pycache__", ".mypy_cache", ".ruff_cache", "build", "dist", "*.egg-info", "tests/fixtures/markdown"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific
]
ignore = ["PLR0913"]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "T201", "T203", "E501", "INP001", "PLR6301", "PLR2004", "PLR0913", "PLR0917", "RUF029", "RUF067", "RUF069", "B017", "PLC2701", "PLC0415"]
"src/docforge/__main__.py" = ["T201"]
"src/docforge/cli/main.py" = ["T201", "PLR0913", "PLR0915", "PLR1702", "RUF100", "E501"]
"src/docforge/api.py" = ["T201", "PLR0913", "PLR0915", "PLR1702", "RUF100", "E501", "PLR0904", "PLC0415", "TRY003", "PLR6301"]
"src/docforge/crawler/cache.py" = ["PLR6301"]
"src/docforge/crawler/engine.py" = ["PLR0915", "PLR1702", "PLR2004"]
"src/docforge/crawler/fetcher.py" = ["PLR2004"]
"src/docforge/storage/metadata_store.py" = ["PLR0904", "PLR0917"]
"src/docforge/storage/engine.py" = ["TRY003"]
"tests/unit/test_storage.py" = ["PLR0917"]
"src/docforge/extractor/callouts.py" = ["PLR0911"]
"src/docforge/embeddings/engine.py" = ["PLR0917", "PLR0914"]
"src/docforge/embeddings/providers/*.py" = ["PLC0415"]
"src/docforge/storage/backends/*.py" = ["PLC0415", "F401", "PLR6301"]
"src/docforge/extractor/cleaners.py" = ["TRY300"]

[tool.ruff.lint.isort]
known-first-party = ["docforge"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
enable_error_code = ["attr-defined"]
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "tests/fixtures",
]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "markdownify", "readability", "voyageai", "openai", "jina", "lancedb", "weaviate", "weaviate.*", "pyarrow"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
    "unit: Unit tests (no network, all mocked)",
    "integration: Integration tests (may use network or external services)",
    "real_network: Tests that hit live external websites",
    "benchmark: Performance benchmarks",
    "slow: Tests that take >5 seconds",
]

[tool.coverage.run]
source = ["src/docforge"]
omit = [
    "tests/*",
    "src/docforge/_version.py",
    "src/docforge/storage/backends/chromadb.py",
    "src/docforge/storage/backends/lancedb.py",
    "src/docforge/storage/backends/qdrant.py",
    "src/docforge/storage/backends/weaviate.py",
]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true

[tool.pre-commit-hooks]
[tool.pre-commit-hooks.ruff-check]
id = "ruff-check"
name = "Ruff check"
entry = "ruff check"
language = "system"
types = ["python"]
args = ["--fix"]

[tool.pre-commit-hooks.ruff-format]
id = "ruff-format"
name = "Ruff format"
entry = "ruff format"
language = "system"
types = ["python"]
args = ["--fix"]

[tool.pre-commit-hooks.mypy]
id = "mypy"
name = "MyPy type check"
entry = "mypy"
language = "system"
types = ["python"]
args = ["src/docforge"]
